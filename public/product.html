<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <h1 data-testid="store-title">E-Commerce Store</h1>
            <div class="nav-links">
                <a href="index.html" data-testid="nav-home">Home</a>
                <a href="cart.html" data-testid="nav-cart">Cart (<span data-testid="cart-count">0</span>)</a>
            </div>
        </nav>
    </header>

    <main class="product-details">
        <div class="product-detail-container" data-testid="product-detail-container">
            <div class="product-image-container">
                <img src="" alt="Product Image" data-testid="product-image" class="product-image">
            </div>
            <div class="product-info">
                <h1 data-testid="product-title"></h1>
                <p class="product-description" data-testid="product-description"></p>
                <p class="product-price" data-testid="product-price"></p>
                <div class="quantity-section">
                    <label for="quantity">Quantity:</label>
                    <input 
                        type="number" 
                        id="quantity" 
                        name="quantity" 
                        min="1" 
                        value="1" 
                        data-testid="quantity-input"
                    >
                </div>
                <button class="add-to-cart-btn" data-testid="add-to-cart-button">Add to Cart</button>
                <a href="index.html" class="back-link" data-testid="back-to-home">← Back to Products</a>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
