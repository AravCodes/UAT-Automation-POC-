<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Commerce Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <h1 data-testid="store-title">E-Commerce Store</h1>
            <div class="nav-links">
                <a href="index.html" data-testid="nav-home">Home</a>
                <a href="cart.html" data-testid="nav-cart">Cart (<span data-testid="cart-count">0</span>)</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form-container" data-testid="login-form-container">
            <h2 data-testid="login-page-title">Login</h2>
            <form id="login-form" data-testid="login-form">
                <div class="form-group">
                    <label for="email" data-testid="email-label">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        data-testid="email-input"
                        placeholder="Enter your email"
                    >
                </div>
                <div class="form-group">
                    <label for="password" data-testid="password-label">Password:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        data-testid="password-input"
                        placeholder="Enter your password"
                    >
                </div>
                <div class="error-message" data-testid="login-error-message" style="display: none;"></div>
                <button type="submit" class="auth-button" data-testid="login-submit-button">Login</button>
            </form>
            <p class="auth-link">
                Don't have an account? <a href="signup.html" data-testid="signup-link">Sign up here</a>
            </p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
