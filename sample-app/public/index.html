<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-Commerce Store</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #f6f7f9; }
    .header { background: #2563eb; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 1.5rem; }
    .cart-link { color: #fff; text-decoration: none; font-weight: 600; padding: 8px 16px; background: rgba(255,255,255,0.2); border-radius: 6px; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 24px; }
    .product-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .product-image { width: 100%; height: 200px; background: #e5e7eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 3rem; margin-bottom: 12px; }
    .product-title { font-size: 1.125rem; font-weight: 600; margin: 8px 0; color: #111827; }
    .product-price { font-size: 1.5rem; font-weight: 700; color: #2563eb; margin: 8px 0; }
    .product-description { color: #6b7280; font-size: 0.875rem; margin: 8px 0; }
    .add-to-cart-btn { width: 100%; padding: 10px 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 12px; }
    .add-to-cart-btn:hover { background: #1d4ed8; }
    .add-to-cart-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; }
    .msg.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="header">
    <h1 data-testid="store-title">E-Commerce Store</h1>
    <a href="/cart" class="cart-link" data-testid="cart-link">
      Cart (<span id="cart-count" data-testid="cart-count">0</span>)
    </a>
  </div>
  <div class="container">
    <h2 data-testid="products-title">Products</h2>
    <div id="products-grid" class="products-grid" data-testid="products-grid">
      <!-- Products will be loaded here -->
    </div>
    <div id="message-box" class="msg" style="display:none" data-testid="message-box"></div>
  </div>
  <script>
    const products = [
      { id: 1, name: "Wireless Headphones", price: 79.99, description: "High-quality wireless headphones with noise cancellation", image: "🎧" },
      { id: 2, name: "Smart Watch", price: 199.99, description: "Feature-rich smartwatch with fitness tracking", image: "⌚" },
      { id: 3, name: "Laptop Stand", price: 49.99, description: "Ergonomic aluminum laptop stand", image: "💻" },
      { id: 4, name: "USB-C Cable", price: 12.99, description: "Fast charging USB-C cable, 6ft", image: "🔌" },
      { id: 5, name: "Wireless Mouse", price: 29.99, description: "Ergonomic wireless mouse with long battery life", image: "🖱️" },
      { id: 6, name: "Mechanical Keyboard", price: 89.99, description: "RGB mechanical keyboard with blue switches", image: "⌨️" }
    ];

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      document.getElementById('cart-count').textContent = cart.length;
    }

    function showMessage(text, type) {
      const msgBox = document.getElementById('message-box');
      msgBox.textContent = text;
      msgBox.className = `msg ${type}`;
      msgBox.style.display = 'block';
      setTimeout(() => { msgBox.style.display = 'none'; }, 3000);
    }

    function addToCart(productId) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const product = products.find(p => p.id === productId);
      if (product) {
        cart.push(product);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        showMessage(`${product.name} added to cart!`, 'success');
      }
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(product => `
        <div class="product-card" data-testid="product-card-${product.id}">
          <div class="product-image" data-testid="product-image-${product.id}">${product.image}</div>
          <div class="product-title" data-testid="product-title-${product.id}">${product.name}</div>
          <div class="product-price" data-testid="product-price-${product.id}">$${product.price.toFixed(2)}</div>
          <div class="product-description" data-testid="product-description-${product.id}">${product.description}</div>
          <button class="add-to-cart-btn" data-testid="add-to-cart-${product.id}" onclick="addToCart(${product.id})">
            Add to Cart
          </button>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderProducts();
      updateCartCount();
    });
  </script>
</body>
</html>
