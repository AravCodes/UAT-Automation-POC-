<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #f6f7f9; }
    .header { background: #2563eb; color: #fff; padding: 16px 24px; }
    .header h1 { margin: 0; font-size: 1.5rem; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 400px; gap: 24px; }
    .checkout-form { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; }
    .order-summary { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; height: fit-content; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #111827; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
    input:focus, select:focus { outline: none; border-color: #2563eb; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .section-title { font-size: 1.25rem; font-weight: 600; margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 2px solid #e5e7eb; }
    .section-title:first-child { margin-top: 0; }
    .order-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .order-item:last-child { border-bottom: none; }
    .summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .summary-row.total { border-bottom: none; border-top: 2px solid #2563eb; margin-top: 12px; padding-top: 16px; font-size: 1.25rem; font-weight: 700; }
    .place-order-btn { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1.125rem; margin-top: 16px; }
    .place-order-btn:hover { background: #1d4ed8; }
    .place-order-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; }
    .msg.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .success-page { text-align: center; padding: 48px; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .success-icon { font-size: 4rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 data-testid="checkout-title">Checkout</h1>
  </div>
  <div class="container">
    <div id="checkout-form-container" data-testid="checkout-form-container">
      <form id="checkout-form" class="checkout-form" data-testid="checkout-form" onsubmit="handleCheckout(event)">
        <div class="section-title" data-testid="shipping-section">Shipping Information</div>
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" data-testid="full-name-input" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" data-testid="email-input" required />
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" data-testid="address-input" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" data-testid="city-input" required />
          </div>
          <div class="form-group">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" name="zip" data-testid="zip-input" required />
          </div>
        </div>
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country" data-testid="country-select" required>
            <option value="">Select Country</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="UK">United Kingdom</option>
            <option value="AU">Australia</option>
          </select>
        </div>

        <div class="section-title" data-testid="payment-section">Payment Information</div>
        <div class="form-group">
          <label for="card-number">Card Number</label>
          <input type="text" id="card-number" name="cardNumber" data-testid="card-number-input" placeholder="1234 5678 9012 3456" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="expiry">Expiry Date</label>
            <input type="text" id="expiry" name="expiry" data-testid="expiry-input" placeholder="MM/YY" required />
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" data-testid="cvv-input" placeholder="123" required />
          </div>
        </div>

        <div id="message-box" class="msg" style="display:none" data-testid="message-box"></div>
      </form>
    </div>

    <div class="order-summary" data-testid="order-summary">
      <h2 data-testid="order-summary-title">Order Summary</h2>
      <div id="order-items" data-testid="order-items">
        <!-- Order items will be loaded here -->
      </div>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="summary-subtotal" data-testid="summary-subtotal">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Tax (10%)</span>
        <span id="summary-tax" data-testid="summary-tax">$0.00</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="summary-total" data-testid="summary-total">$0.00</span>
      </div>
      <button type="submit" form="checkout-form" class="place-order-btn" data-testid="place-order-button">
        Place Order
      </button>
    </div>
  </div>

  <div id="success-page" class="success-page" style="display:none" data-testid="success-page">
    <div class="success-icon">✅</div>
    <h2 data-testid="success-title">Order Placed Successfully!</h2>
    <p data-testid="success-message">Thank you for your purchase. Your order confirmation will be sent to your email.</p>
    <a href="/" style="display:inline-block;margin-top:24px;padding:12px 24px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;">
      Continue Shopping
    </a>
  </div>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem('cart') || '[]');
    }

    function calculateTotals() {
      const cart = getCart();
      const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
      const tax = subtotal * 0.1;
      const total = subtotal + tax;
      return { subtotal, tax, total };
    }

    function renderOrderSummary() {
      const cart = getCart();
      const itemsContainer = document.getElementById('order-items');
      const { subtotal, tax, total } = calculateTotals();

      itemsContainer.innerHTML = cart.map(item => `
        <div class="order-item" data-testid="order-item-${item.id}">
          <span data-testid="order-item-name-${item.id}">${item.name}</span>
          <span data-testid="order-item-price-${item.id}">$${item.price.toFixed(2)}</span>
        </div>
      `).join('');

      document.getElementById('summary-subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('summary-tax').textContent = `$${tax.toFixed(2)}`;
      document.getElementById('summary-total').textContent = `$${total.toFixed(2)}`;
    }

    function showMessage(text, type) {
      const msgBox = document.getElementById('message-box');
      msgBox.textContent = text;
      msgBox.className = `msg ${type}`;
      msgBox.style.display = 'block';
      setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
    }

    function handleCheckout(event) {
      event.preventDefault();
      const cart = getCart();
      
      if (cart.length === 0) {
        showMessage('Your cart is empty', 'error');
        return;
      }

      const formData = new FormData(event.target);
      const orderData = {
        fullName: formData.get('fullName'),
        email: formData.get('email'),
        address: formData.get('address'),
        city: formData.get('city'),
        zip: formData.get('zip'),
        country: formData.get('country'),
        cardNumber: formData.get('cardNumber'),
        expiry: formData.get('expiry'),
        cvv: formData.get('cvv'),
        items: cart,
        total: calculateTotals().total
      };

      // Simulate order processing
      setTimeout(() => {
        localStorage.removeItem('cart');
        document.querySelector('.container').style.display = 'none';
        document.getElementById('success-page').style.display = 'block';
      }, 1000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const cart = getCart();
      if (cart.length === 0) {
        window.location.href = '/';
        return;
      }
      renderOrderSummary();
    });
  </script>
</body>
</html>
