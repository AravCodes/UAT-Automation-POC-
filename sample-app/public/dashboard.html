<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #f6f7f9; }
    .container { max-width: 720px; margin: 10vh auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: #ecfeff; color: #155e75; border: 1px solid #67e8f9; }
    a { color: #2563eb; }
  </style>
  <script>
    function init() {
      const params = new URLSearchParams(window.location.search);
      const welcome = document.getElementById('welcome');
      if (params.get('welcome') === '1') {
        welcome.style.display = 'block';
      }
    }
    window.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <div class="container">
    <h1 data-testid="dashboard-title">Dashboard</h1>
    <div id="welcome" class="msg" style="display:none" data-testid="welcome-message">Welcome back!</div>
    <p>Success! You are logged in.</p>
    <p><a href="/login" data-testid="logout-link">Log out</a></p>
  </div>
</body>
</html>
