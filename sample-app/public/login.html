<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #f6f7f9; }
    .container { max-width: 420px; margin: 10vh auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d7dce1; border-radius: 6px; margin-top: 6px; }
    button { width: 100%; margin-top: 16px; padding: 10px 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; }
    .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .hint { color: #64748b; font-size: 12px; margin-top: 6px; }
  </style>
  <script>
    function showMessageFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const errorBox = document.getElementById('errorBox');
      if (params.get('error') === '1') {
        errorBox.textContent = 'Invalid email or password.';
        errorBox.style.display = 'block';
      }
    }
    window.addEventListener('DOMContentLoaded', showMessageFromQuery);
  </script>
  </head>
<body>
  <div class="container">
    <h1 data-testid="login-title">Sign in to your account</h1>
    <form method="post" action="/login" data-testid="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="user@example.com" data-testid="email-input" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password123!" data-testid="password-input" required />
      <button type="submit" data-testid="login-button">Login</button>
      <div id="errorBox" class="msg error" style="display:none" data-testid="login-error"></div>
      <div class="hint">Valid creds for demo: user@example.com / Password123!</div>
    </form>
  </div>
</body>
</html>
