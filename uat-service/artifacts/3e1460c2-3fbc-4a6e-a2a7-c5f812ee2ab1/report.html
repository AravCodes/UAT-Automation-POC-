<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UAT Report</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 20px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; color: #fff; font-weight: 600; }
    .pass { background: #16a34a; }
    .fail { background: #dc2626; }
    .partial { background: #d97706; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    .muted { color: #6b7280; font-size: 12px; }
  </style>
  </head>
<body>
  <h1>UAT Report</h1>
  <p>Score: <strong>100.0%</strong></p>
  <p>Status: <span class="badge pass">PASS</span></p>
  <p class="muted">Scenarios: 2 passed / 0 failed / 2 total</p>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Scenario</th>
        <th>Status</th>
        <th>Errors</th>
      </tr>
    </thead>
    <tbody>
    
      <tr>
        <td>1</td>
        <td>Scenario 1: Login as a User</td>
        <td>
          
            <span class="badge pass">PASS</span>
          
        </td>
        <td>-</td>
      </tr>
    
      <tr>
        <td>2</td>
        <td>Scenario 1: Login as a User</td>
        <td>
          
            <span class="badge pass">PASS</span>
          
        </td>
        <td>-</td>
      </tr>
    
    </tbody>
  </table>

</body>
</html>
